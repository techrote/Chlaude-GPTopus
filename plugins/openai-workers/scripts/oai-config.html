<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAI CONFIG</title>
<style nonce="__NONCE__">
:root{
  /* semantic tokens (set live by the COLOURWAY panel; defaults = WINAMP LIME) */
  --c-shadow:#020302;--c-bg:#070907;--c-panel:#121712;--c-line:#243024;--c-panel-hi:#33432f;--c-text-dim:#8aa184;--c-text:#d6e8cc;
  --c-lcd-bg:#041204;--c-accent-2:#8fdc1e;--c-accent:#b8ff3c;--c-ok:#b8ff3c;--c-lcd:#7dff4f;--c-info:#6fd6ff;--c-warn:#ffb627;--c-hot:#ff6b2c;--c-err:#ff4545;--c-pending:#ff4545;
  /* fixed hazard/launch-button colours (not part of the colourway) */
  --hz-1:#f2f2f2;--hz-2:#f2c200;--hz-3:#121212;--hz-4:#0b0b0b;--hz-5:#2a2a2a;--hz-6:#000;--hz-7:rgba(0,0,0,.55);--hz-8:#ffd0c8;--hz-9:#ff2a1a;--hz-10:#8a0a00;--hz-11:#3a0000;--hz-12:#ff7a6b;--hz-13:#d81300;--hz-14:#6e0700;--hz-15:#fff;--hz-16:#1b1b1b;--hz-17:rgba(220,240,255,.55);--hz-18:rgba(255,255,255,.38);--hz-19:rgba(190,220,255,.12);--hz-20:rgba(255,255,255,.05);--hz-21:rgba(255,255,255,.22);--hz-22:rgba(255,255,255,.6);--hz-23:rgba(0,0,0,.6);--hz-24:rgba(255,255,255,.8);--hz-25:#d8d8d8;--hz-26:#151515;--hz-27:#cfcfcf;--hz-28:#c81200;--hz-29:#ff9c90;--hz-30:#5a0500;
  /* everything below derives from the tokens */
  --bg:var(--c-bg);--panel:var(--c-panel);--hi:var(--c-panel-hi);--lo:var(--c-shadow);--line:var(--c-line);
  --bg2:color-mix(in oklab,var(--c-bg) 60%,var(--c-panel));--panel2:color-mix(in oklab,var(--c-panel) 80%,var(--c-panel-hi));--inset:color-mix(in oklab,var(--c-bg) 50%,var(--c-shadow));
  --lime:var(--c-accent);--lime2:var(--c-accent-2);--limedim:color-mix(in oklab,var(--c-accent-2) 45%,var(--c-panel));--lcd:var(--c-lcd);--lcdbg:var(--c-lcd-bg);
  --text:var(--c-text);--mute:var(--c-text-dim);--faint:color-mix(in oklab,var(--c-text-dim) 55%,var(--c-bg));
  --amber:var(--c-warn);--orange:var(--c-hot);--red:var(--c-err);--cyan:var(--c-info);--ok:var(--c-ok);--pend:var(--c-pending);
  --bev-hi:color-mix(in oklab,var(--c-panel-hi) 80%,var(--c-text));--btn1:color-mix(in oklab,var(--c-panel-hi) 45%,var(--c-panel));--btn2:color-mix(in oklab,var(--c-panel) 80%,var(--c-shadow));
  --hdr1:color-mix(in oklab,var(--c-panel) 85%,var(--c-panel-hi));--hdr2:color-mix(in oklab,var(--c-panel) 55%,var(--c-bg));
  --on1:color-mix(in oklab,var(--c-accent) 85%,var(--c-text));--on2:var(--c-accent-2);--on-hi:color-mix(in oklab,var(--c-accent) 50%,var(--c-text));--on-lo:color-mix(in oklab,var(--c-accent-2) 40%,var(--c-shadow));--on-text:color-mix(in oklab,var(--c-shadow) 88%,var(--c-accent));
  --wn1:color-mix(in oklab,var(--c-warn) 75%,var(--c-text));--wn-hi:color-mix(in oklab,var(--c-warn) 45%,var(--c-text));--wn-lo:color-mix(in oklab,var(--c-warn) 40%,var(--c-shadow));--wn-text:color-mix(in oklab,var(--c-shadow) 90%,var(--c-warn));
  --lcd-edge:color-mix(in oklab,var(--c-line) 85%,var(--c-lcd));--led-off:color-mix(in oklab,var(--c-panel-hi) 40%,var(--c-panel));--err-bg:color-mix(in oklab,var(--c-err) 22%,var(--c-shadow));
  --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  --row:24px;--g1:2px;--g2:4px;--g3:8px;--pad:6px;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:12px/1.3 var(--mono);font-variant-numeric:tabular-nums}
body{background:radial-gradient(1200px 600px at 80% -10%,color-mix(in oklab,var(--lime) 8%,var(--bg)) 0,transparent 60%),repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--text) 1.5%,transparent) 3px 4px),var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
.bevel{background:var(--panel);border:1px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--panel) 40%,var(--lo))}
.inset{background:var(--inset);border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:20px;padding:0 7px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(var(--btn1),var(--btn2));border:1px solid;border-color:var(--bev-hi) var(--lo) var(--lo) var(--bev-hi);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--lime);border-color:var(--limedim) var(--lo) var(--lo) var(--limedim)}
.btn:active{border-color:var(--lo) var(--bev-hi) var(--bev-hi) var(--lo);background:var(--bg2)}
.btn.on{background:linear-gradient(var(--on1),var(--on2));color:var(--on-text);border-color:var(--on-hi) var(--on-lo) var(--on-lo) var(--on-hi);font-weight:700}
.btn.warn{color:var(--wn-text);background:linear-gradient(var(--wn1),var(--amber));border-color:var(--wn-hi) var(--wn-lo) var(--wn-lo) var(--wn-hi);font-weight:700}
.btn.ico{width:20px;padding:0;display:inline-grid;place-items:center}
.btn:disabled{opacity:.4;cursor:default}
.lcd{background:var(--lcdbg);color:var(--lcd);text-shadow:0 0 4px color-mix(in srgb,var(--lcd) 55%,transparent);border:1px solid;border-color:var(--lo) var(--lcd-edge) var(--lcd-edge) var(--lo);box-shadow:inset 0 0 12px color-mix(in srgb,var(--lo) 80%,transparent)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 0 0 1px var(--lo);vertical-align:middle}
.led.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.led.bad{background:var(--red);box-shadow:0 0 6px var(--red)}
.led.amb{background:var(--amber);box-shadow:0 0 6px var(--amber)}
/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--hdr1),var(--hdr2));border-bottom:1px solid var(--lo);box-shadow:0 1px 0 var(--line),0 6px 18px color-mix(in srgb,var(--lo) 60%,transparent)}
.titlebar{display:flex;align-items:center;gap:var(--g3);padding:2px var(--pad);height:16px;background:repeating-linear-gradient(0deg,var(--hdr1) 0 1px,var(--hdr2) 1px 3px);border-bottom:1px solid var(--lo)}
.titlebar b{color:var(--lime);letter-spacing:.3em;font-size:11px}
.titlebar .grip{flex:1;height:6px;background:repeating-linear-gradient(0deg,color-mix(in oklab,var(--hi) 85%,var(--panel)) 0 1px,transparent 1px 3px);border-top:1px solid var(--lo)}
.titlebar .sub{color:var(--faint);font-size:10px;letter-spacing:.12em}
.bar{display:flex;flex-wrap:wrap;align-items:stretch;gap:var(--g2);padding:2px var(--pad)}
.readout{display:flex;align-items:center;gap:6px;padding:0 5px;min-height:0}
.readout .big{font-size:17px;letter-spacing:.06em;line-height:20px}
.tt{position:relative;display:inline-grid;place-items:center;height:18px;padding:0 4px;font-size:10px;letter-spacing:.08em;border:1px solid var(--line);color:var(--faint);cursor:pointer;user-select:none}
.tt:has(input:checked){color:var(--lcd);border-color:var(--lcd-edge);text-shadow:0 0 4px var(--lcd)}
.tt input{position:absolute;opacity:0;width:0;height:0}
.readout .small{font-size:10px;line-height:1.35;letter-spacing:.06em}
.presets{display:flex;flex-wrap:wrap;align-items:center;gap:var(--g1);padding:3px 4px;max-width:100%;min-width:0}
.presets select{height:20px;background:var(--inset);border:1px solid var(--line);color:var(--lime);padding:0 4px;min-width:100px;max-width:190px}
.presets input[type=text]{height:20px;width:110px;background:var(--inset);border:1px solid var(--line);padding:0 4px;color:var(--text)}
.chk{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:0 3px}
.chk input{accent-color:var(--lime);margin:0}
/* live strip */
.live{display:grid;grid-template-columns:minmax(170px,.8fr) minmax(250px,1.6fr) minmax(200px,1.1fr) minmax(210px,1.2fr);gap:var(--g2);padding:0 var(--pad) var(--g2)}
.cell{padding:3px 6px;min-width:0}
.cell h4{margin:0 0 2px;font-size:9.5px;letter-spacing:.16em;color:var(--lime2);font-weight:700}
.kv{display:flex;gap:6px;align-items:center;font-size:11px;min-width:0;white-space:nowrap}
.kv .lab{flex:0 0 auto}
.kv .v{color:var(--text);overflow:hidden;text-overflow:ellipsis}
.qbar{position:relative;height:9px;flex:1;min-width:60px;background:var(--inset);border:1px solid var(--line);overflow:hidden}
.qbar i{position:absolute;top:0;bottom:0;left:0}
.qbar .u{background:repeating-linear-gradient(90deg,var(--lime) 0 3px,color-mix(in oklab,var(--lime) 65%,var(--lo)) 3px 4px)}
.qbar .r{background:repeating-linear-gradient(90deg,var(--amber) 0 3px,color-mix(in oklab,var(--amber) 62%,var(--lo)) 3px 4px)}
.qbar .t{width:1px;background:var(--text);opacity:.7}
.mini{font-size:10px;color:var(--mute)}
/* pending */
#pending{display:none;align-items:center;gap:var(--g3);padding:9px calc(var(--pad) + 4px);margin:3px 0;color:var(--hz-1);
  background:repeating-linear-gradient(-45deg,var(--hz-2) 0 13px,var(--hz-3) 13px 26px);
  clip-path:polygon(0 3px,2% 0,5% 4px,9% 1px,13% 5px,18% 0,24% 3px,31% 0,37% 4px,44% 1px,52% 5px,58% 0,65% 3px,71% 1px,78% 5px,84% 0,90% 4px,95% 1px,100% 3px,100% calc(100% - 4px),97% 100%,92% calc(100% - 3px),86% 100%,80% calc(100% - 5px),73% 100%,67% calc(100% - 2px),60% 100%,54% calc(100% - 4px),47% 100%,40% calc(100% - 3px),33% 100%,27% calc(100% - 5px),21% 100%,15% calc(100% - 2px),10% 100%,4% calc(100% - 4px),0 100%)}
#pending .plate{display:flex;flex-wrap:wrap;align-items:center;gap:var(--g3);flex:1;min-width:0;padding:3px 8px;background:var(--hz-4);border:1px solid var(--hz-5);box-shadow:inset 0 0 0 1px var(--hz-6),0 0 0 2px var(--hz-7)}
#pending.show{display:flex;flex-wrap:wrap}
#pending .msg{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--hz-2)}
#pending .led{width:13px;height:13px;background:radial-gradient(circle at 35% 30%,var(--hz-8),var(--hz-9) 45%,var(--hz-10));box-shadow:0 0 10px var(--hz-9),0 0 2px var(--hz-6) inset}
.launch{position:relative;width:120px;height:34px;flex:0 0 auto;perspective:220px}
.launch .fire{position:absolute;inset:4px 6px;border-radius:3px;border:1px solid var(--hz-11);background:radial-gradient(ellipse at 50% 30%,var(--hz-12),var(--hz-13) 55%,var(--hz-14));color:var(--hz-15);font-weight:800;font-size:10px;letter-spacing:.08em;white-space:nowrap;padding:0;text-shadow:0 1px 0 var(--hz-6);box-shadow:0 3px 0 var(--hz-11),0 0 0 3px var(--hz-16),0 0 0 4px var(--hz-2);cursor:pointer}
.launch .fire:active{transform:translateY(2px);box-shadow:0 1px 0 var(--hz-11),0 0 0 3px var(--hz-16),0 0 0 4px var(--hz-2)}
.launch .fire:disabled{cursor:not-allowed}
.launch .cover{position:absolute;inset:0;border-radius:4px;border:1px solid var(--hz-17);background:linear-gradient(160deg,var(--hz-18),var(--hz-19) 40%,var(--hz-20) 60%,var(--hz-21));box-shadow:inset 0 1px 0 var(--hz-22),0 2px 4px var(--hz-23);transform-origin:50% 0;cursor:pointer;color:transparent;font-size:0;padding:0;z-index:2}
.launch .cover::after{content:"LIFT";position:absolute;bottom:2px;right:4px;font-size:8px;letter-spacing:.1em;color:var(--hz-24)}
.launch.open .cover{transform:rotateX(-112deg);pointer-events:none}
.launch.open .cover::after{content:""}
@media (prefers-reduced-motion:no-preference){.launch .cover{transition:transform .18s ease-out}}
#pending .names{flex:1;min-width:120px;font-size:10px;color:var(--hz-25);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pending select{height:20px;background:var(--hz-26);border:1px solid var(--hz-2);color:var(--hz-2)}
#pending .chk{color:var(--hz-27)}

/* steering console */
#steer{display:grid;gap:3px;padding:3px 5px;margin:2px var(--pad)}
#steer .srow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--g2);min-width:0}
#steer .runs{flex:1;display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:thin}
#steer .run{flex:0 0 auto;height:20px;padding:0 6px;font-size:10px;letter-spacing:.04em;background:var(--bg2);color:var(--mute);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
#steer .run b{color:var(--lime);margin-right:4px}
#steer .run.paused{border-color:var(--amber)}
#steer .run.paused::after{content:" ‖";color:var(--amber)}
#steer .run.sel{background:linear-gradient(var(--on1),var(--on2));color:var(--on-text);border-color:var(--on-hi)}
#steer .run.sel b{color:var(--on-text)}
#steer .run.ended{opacity:.5}
#steer .macros{display:flex;gap:1px}
#steer .macros button{width:24px;height:18px;padding:0;font-size:10px;background:var(--bg2);color:var(--mute);border:1px solid var(--line);cursor:pointer}
#steer .macros button.has{color:var(--lcd);border-color:var(--lcd-edge)}
#steer .macros button:hover{color:var(--lime)}
#steer .in{flex:1;min-width:160px;height:22px;padding:0 6px;background:var(--lcdbg);color:var(--lcd);border:1px solid;border-color:var(--lo) var(--lcd-edge) var(--lcd-edge) var(--lo);font-size:12px}
#steer .flag{height:20px;padding:0 5px;font-size:9.5px;letter-spacing:.06em}
#steer .flag.on.hard{background:linear-gradient(var(--hz-12),var(--hz-28));color:var(--hz-15);border-color:var(--hz-29) var(--hz-30) var(--hz-30) var(--hz-29)}
#steer .log{max-height:62px;overflow-y:auto;font-size:10px;line-height:1.35;color:var(--mute);background:var(--inset);border:1px solid var(--line);padding:1px 4px;white-space:nowrap}
#steer .log div{overflow:hidden;text-overflow:ellipsis}
#steer .log .sent{color:var(--text)}#steer .log .delivered{color:var(--lime2)}#steer .log .reply{color:var(--cyan)}#steer .log .err{color:var(--red)}
#steer .conn{font-size:9.5px;letter-spacing:.08em}
#steer .conn.off{color:var(--red)}
#steer.collapsed .log,#steer.collapsed .mrow{display:none}
body.steer-bottom #steer{position:fixed;left:0;right:0;bottom:24px;z-index:16;margin:0;box-shadow:0 -6px 18px color-mix(in srgb,var(--lo) 70%,transparent)}
body.steer-bottom main{padding-bottom:150px}
/* layout */
main{display:grid;grid-template-columns:minmax(320px,380px) 1fr;gap:var(--g3);padding:var(--g3) var(--pad) 40px;align-items:start}
.col{display:grid;gap:var(--g3);align-content:start}
.workers{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--g3)}
.panel{min-width:0}
.ph{display:flex;align-items:center;gap:var(--g2);padding:2px 3px 2px 6px;height:24px;background:linear-gradient(var(--hdr1),var(--hdr2));border-bottom:1px solid var(--lo)}
.ph .name{font-weight:700;letter-spacing:.14em;color:var(--lime);font-size:11.5px;white-space:nowrap}
.ph .name::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 5px var(--lime);vertical-align:0}
.ph .spacer{flex:1}
.ph .name{cursor:grab}
.ph .msum{font-size:10px;color:var(--lcd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:none}
.panel.min .ph .msum{display:block}
.panel.min .pb,.panel.min .summary{display:none}
.panel.dragging{opacity:.45}
.panel.drop-before{box-shadow:0 -3px 0 var(--lime)}
.panel.drop-after{box-shadow:0 3px 0 var(--lime)}
.workers .panel.drop-before{box-shadow:-3px 0 0 var(--lime)}
.workers .panel.drop-after{box-shadow:3px 0 0 var(--lime)}
.chip{font-size:9.5px;letter-spacing:.08em;padding:1px 4px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.free{color:var(--cyan);border-color:color-mix(in oklab,var(--cyan) 35%,var(--lo))}
.chip.paid{color:var(--amber);border-color:color-mix(in oklab,var(--amber) 35%,var(--lo))}
.chip.info{color:var(--cyan);border-color:color-mix(in oklab,var(--cyan) 35%,var(--lo))}
.ph .btn.lock.on{background:linear-gradient(var(--wn1),var(--amber));border-color:var(--wn-hi) var(--wn-lo) var(--wn-lo) var(--wn-hi);color:var(--wn-text)}
.summary{padding:2px 6px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:var(--g2) var(--g2) 0}
.pb{padding:var(--g2) var(--g2) var(--g2)}
.panel.locked .pb{box-shadow:inset 3px 0 0 var(--amber)}
/* rows */
.row{display:grid;grid-template-columns:96px minmax(60px,1fr) 74px 20px 20px;align-items:center;gap:var(--g2);min-height:var(--row);padding:1px 2px;border-bottom:1px solid var(--bg2)}
.row:hover{background:color-mix(in srgb,var(--lime) 3%,transparent)}
.row .lab{cursor:help}
.row.set .lab{color:var(--text)}
.row.set .lab::after{content:" •";color:var(--lime)}
.row.err{background:color-mix(in srgb,var(--red) 7%,transparent)}
.row .msg{grid-column:1/-1;font-size:10px;color:var(--red);padding:0 0 2px 98px;display:none}
.row .msg.warn{color:var(--orange)}
.row .msg.show{display:block}
.row .msg::before{content:"✖ "}
.row .msg.warn::before{content:"▲ "}
.num{height:20px;width:100%;text-align:right;padding:0 4px;background:var(--lcdbg);color:var(--lcd);border:1px solid;border-color:var(--lo) var(--lcd-edge) var(--lcd-edge) var(--lo);font-size:12px}
.num::placeholder{color:color-mix(in oklab,var(--lcd) 40%,var(--lcdbg))}
.num.dirty{color:var(--amber);border-color:var(--amber)}
.num.bad{color:var(--text);background:var(--err-bg);border-color:var(--red)}
.track{position:relative;height:20px;display:flex;align-items:center}
.track .flag{position:absolute;top:2px;font-size:9px;color:var(--faint);pointer-events:none}
.track .flag.l{left:-1px}.track .flag.r{right:-1px}
.track .flag.lit{color:var(--amber);text-shadow:0 0 4px var(--amber)}
.ticks{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.ticks i{position:absolute;top:3px;width:1px;height:4px;background:var(--limedim)}
.ticks i.def{background:var(--cyan);height:5px}
.ticks i.hot{background:var(--lime);box-shadow:0 0 3px var(--lime)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--limedim),color-mix(in oklab,var(--hi) 70%,var(--panel)));border:1px solid;border-color:var(--lo) var(--line) var(--line) var(--lo)}
input[type=range]::-moz-range-track{height:6px;background:linear-gradient(90deg,var(--limedim),color-mix(in oklab,var(--hi) 70%,var(--panel)));border:1px solid;border-color:var(--lo) var(--line) var(--line) var(--lo)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:16px;margin-top:-6px;background:linear-gradient(var(--on-hi),var(--lime) 45%,color-mix(in oklab,var(--lime2) 65%,var(--lo)));border:1px solid;border-color:var(--on-hi) var(--on-lo) var(--on-lo) var(--on-hi)}

<section id="steer" class="bevel" aria-label="Steering console">

  <div class="srow mrow"><span class="lab" id="macroLab">MACROS</span><div class="macros" id="macros"></div></div>
  <div class="srow">

    <button class="btn flag hard" data-f="hard" title="HARD: cancel the in-flight OpenAI request and resend with this tip (tokens already spent on it are lost)">HARD</button>
    <button class="btn flag" data-f="pin" title="PIN: repeat this tip at every step for the rest of the task">PIN</button>
    <button class="btn flag" data-f="ack" title="ACK: worker starts its next reply with a one-line acknowledgement">ACK</button>
    <button class="btn flag" data-f="assess" title="ASSESS: worker states how it understood the tip">ASSESS</button>
    <button class="btn flag" data-f="conseq" title="CONSEQ: worker states how the tip changes its approach">CONSEQ</button>
    <button class="btn on" id="steerSend">SEND</button>
  </div>
  <div class="log" id="steerLog" aria-live="polite"></div>
</section>
<header>
  <div class="titlebar"><b>OAI</b><span class="grip"></span><span class="sub">OPENAI WORKERS · CONFIGURATION DECK</span><span class="grip"></span><span class="sub" id="ver">v—</span></div>
  <div class="bar">
    <div class="readout lcd" id="lcd">
      <div class="big" id="clock">--:--</div>
      <label class="tt" title="Tooltips on/off"><input type="checkbox" id="tips" checked>TT</label>
    </div>
    <div class="presets bevel" role="group" aria-label="Presets">
      <span class="lab">PRESET</span>
      <select id="presetSel" aria-label="Preset"></select>
      <button class="btn" id="presetLoad" title="Load the selected preset into all unlocked groups">LOAD</button>
      <input type="text" id="presetName" placeholder="name…" aria-label="New preset name" maxlength="48">
      <button class="btn" id="presetSave" title="Save the whole current configuration as a named preset">SAVE</button>
      <button class="btn ico" id="presetDel" title="Delete the selected user preset" aria-label="Delete preset">−</button>
      <label class="chk" title="Load ignores group locks this one time; the locks themselves are not changed"><input type="checkbox" id="overrideLocks">G:UNLOCK</label>
    </div>
    <div class="presets bevel"><button class="btn" id="refresh" title="Re-read the stored values">RELOAD</button><span class="mini" id="lcdState"></span></div>
  </div>
  <div id="pending" role="alert">
    <div class="plate">
      <span class="led" aria-hidden="true"></span>
      <span class="msg">CHANGES PENDING — RESTART CLAUDE CODE</span>
      <span class="names" id="pendingNames"></span>
      <label class="chk">AUTO-CLEAR <select id="autoClear" aria-label="Auto-clear pending marker"><option value="0">NEVER</option><option value="10">10 MIN</option><option value="30">30 MIN</option><option value="60">1 H</option><option value="240">4 H</option></select></label>
    </div>
    <div class="launch" id="launch">
      <button class="fire" id="restarted" disabled title="Lift the cover first">I RESTARTED</button>
      <button class="cover" id="launchCover" aria-label="Lift the safety cover over I RESTARTED" aria-expanded="false" title="Lift cover">cover</button>
    </div>
  </div>
  <div class="live">
    <div class="cell bevel"><h4>KEYS</h4><div id="keys"></div></div>
    <div class="cell bevel"><h4>FREE QUOTA · TODAY (UTC)</h4><div id="quota"></div></div>
    <div class="cell bevel"><h4>MONTH · LOCAL ESTIMATE</h4><div id="month"></div></div>
    <div class="cell bevel"><h4>TRACE</h4><div id="trace"></div></div>
  </div>
</header>
<main>
  <div class="col" id="leftCol"></div>
  <div class="col"><div class="workers" id="workers"></div><div id="advHost"></div></div>
</main>
<footer><span class="lab">STATUS</span><div class="lcd" id="status">READY</div></footer>

  E.del.addEventListener('click', async () => {
    const v = E.pick.value; if (!v.startsWith('u:') || !confirm(`Delete colourway ${v.slice(2)}?`)) return;
    const all = { ...(STATE.ui.colourways || {}) }; delete all[v.slice(2)];
    if (await cwPersist({ colourways: all })) { cwList(); status(`Colourway ${v.slice(2)} deleted`); }
  });
  E.vr.addEventListener('input', () => { E.vn.value = E.vr.value; cwEdit(c => { c.variation = Number(E.vr.value); }); });
  E.vn.addEventListener('change', () => { const v = Math.round(Number(E.vn.value)); if (!(v >= 0 && v <= 100)) { E.vn.value = CW.cur.variation; return; } cwEdit(c => { c.variation = v; }); });
  E.seed.addEventListener('change', () => { const v = Math.round(Number(E.seed.value)); if (!(v >= 0 && v <= 2147483647)) { E.seed.value = CW.cur.seed; return; } cwEdit(c => { c.seed = v; }); });
  E.interp.addEventListener('change', () => cwEdit(c => { c.interp = E.interp.value; }));
  E.harmony.addEventListener('change', () => cwEdit(c => { c.harmony = E.harmony.value; }));
  E.lut.addEventListener('click', e => {
    const b = e.target.closest('.sw'); if (!b || e.target.tagName === 'INPUT') return; const i = Number(b.dataset.i);
    if (e.shiftKey) { CW.end = i; cwApply(); return; }
    CW.sel = CW.end = i; cwApply();
    clearTimeout(clickT); clickT = setTimeout(() => cwPick(i), 280);
  });
  E.lut.addEventListener('dblclick', e => { const b = e.target.closest('.sw'); if (!b || e.target.tagName === 'INPUT') return; clearTimeout(clickT); cwHexEdit(E.lut.querySelector(`[data-i="${b.dataset.i}"]`)); });
  E.lut.addEventListener('keydown', e => {
    const b = e.target.closest('.sw'); if (!b || e.target.tagName === 'INPUT') return; const i = Number(b.dataset.i), n = CW.cur.stops.length;
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -8, ArrowDown: 8, Home: -n, End: n }[e.key];
    if (step) { e.preventDefault(); const to = Math.max(0, Math.min(n - 1, (e.shiftKey ? CW.end : i) + step)); if (e.shiftKey) CW.end = to; else CW.sel = CW.end = to; cwApply(); E.lut.querySelector(`[data-i="${to}"]`)?.focus(); }
    else if (e.key === 'F2') { e.preventDefault(); cwHexEdit(b); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); CW.sel = CW.end = i; cwApply(); cwPick(i); }
  });
  const det = h('details', { class: 'adv panel bevel cw', id: 'cwPanel' },
    h('summary', {}, h('div', { class: 'ph' }, h('span', { class: 'name' }, 'COLOURWAY'), h('span', { class: 'chip info', title: 'Only changes how this page looks; never needs a restart' }, 'UI ONLY'), E.ct)), body);
  if (location.hash === '#colourway') det.open = true;
  host.append(det);
  cwList();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && CW.saveT) { clearTimeout(CW.saveT); CW.saveT = 0; cwPersist(); } });
function initColourway(host) {
  const saved = STATE.ui.colourway ? OC.sanitizeColourway(STATE.ui.colourway).cw : null;
  CW.cur = saved || cwClone(OC.BUILTIN_COLOURWAYS['WINAMP LIME']);
  buildColourway(host); cwApply();
}
/* ── steering console (WebSocket) ── */
const SC = { ws: null, runs: [], log: [], macros: [], target: local.get('oai.steer.target', null), flags: {}, retry: 0 };
function steerPlace(where) { document.body.classList.toggle('steer-bottom', where === 'bottom'); $('#steerPlace').textContent = where === 'bottom' ? '▲' : '▼'; $('#steerPlace').title = where === 'bottom' ? 'Move console to the top' : 'Move console to the bottom'; local.set('oai.steer.place', where); }
function steerFold(on) { $('#steer').classList.toggle('collapsed', on); $('#steerFold').textContent = on ? '▣' : '▁'; local.set('oai.steer.fold', on); }
function steerRender() {
  const live = SC.runs.filter(r => r.status !== 'ended');
  if (SC.target !== '*' && !live.some(r => r.agentId === SC.target)) SC.target = live[0]?.agentId ?? null;
  const chip = (id, label, cls, title, run) => h('button', { class: `run ${cls} ${SC.target === id ? 'sel' : ''}`, role: 'radio', 'aria-checked': String(SC.target === id), title, onclick: () => { SC.target = id; local.set('oai.steer.target', id); steerRender(); $('#steerIn').focus(); } }, run ? h('b', {}, run.callsign) : null, label);
  const chips = live.length ? [chip('*', 'ALL', '', 'Every running worker'), ...SC.runs.slice(0, 24).map(r => chip(r.agentId, `${r.worker} · s${r.step ?? 0}`, `${r.status === 'paused' ? 'paused' : ''} ${r.status === 'ended' ? 'ended' : ''}`, `${r.callsign} · ${r.worker}\n${r.description ?? ''}\nstatus ${r.status} · step ${r.step ?? 0} · started ${(r.startedAt ?? '').slice(11, 19)}Z`, r))]
    : [h('span', { class: 'mini' }, 'no worker running')];
  $('#steerRuns').replaceChildren(...chips);
  const icon = { sent: '→', delivered: '✓', reply: '◂' };
  $('#steerLog').replaceChildren(...SC.log.slice(-40).map(e => h('div', { class: e.kind, title: e.text ?? '' }, `${(e.at ?? '').slice(11, 19)} ${icon[e.kind] ?? '·'} ${e.callsign ?? '?'} ${e.kind === 'delivered' ? `delivered @ step ${e.step ?? '?'}` : e.text ?? ''}${e.flags?.length ? ` [${e.flags.join(' ')}]` : ''}`)));
  $('#steerLog').scrollTop = 1e9;
  $('#steerSend').disabled = !SC.target;
}
function steerMacros(m) {
  SC.macros = m.items || [];
  $('#macroLab').title = `Macro files: ${m.dir}\\1.txt … 8.txt (edit them in any text editor; the buttons update live)`;
  $('#macros').replaceChildren(...SC.macros.map(x => h('button', { class: x.text.trim() ? 'has' : '', title: x.text.trim() ? x.label : `${x.n}.txt is empty`, onclick: () => steerPaste(x.text) }, String(x.n))));
}
function steerPaste(text) {
  const el = $('#steerIn'); if (!text) return;
  const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? el.value.length, t = text.replace(/\r?\n/g, ' ').trim();
  el.value = el.value.slice(0, a) + t + el.value.slice(b); el.focus(); el.selectionStart = el.selectionEnd = a + t.length;
}
function steerConnect() {
  const ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(TOKEN)}`); SC.ws = ws;
  ws.onopen = () => { SC.retry = 0; $('#steerConn').textContent = 'LINK'; $('#steerConn').className = 'conn'; };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'steer') { SC.runs = m.runs || []; SC.log = m.log || []; steerRender(); }
    else if (m.type === 'macros') steerMacros(m);
    else if (m.type === 'sent') status(`Tip queued for ${m.sent.map(x => x.callsign).join(', ')}: delivered before the next model step`);
    else if (m.type === 'error') status(`Steer: ${m.error}`, true); };
  ws.onclose = () => { $('#steerConn').textContent = 'NO LINK'; $('#steerConn').className = 'conn off'; SC.ws = null; setTimeout(steerConnect, Math.min(10000, 1000 * 2 ** SC.retry++)); };
}
function steerSend() {
  const el = $('#steerIn'); let text = el.value.trim(); if (!text || !SC.target) return;
  const flags = { ...SC.flags };
  for (;;) { if (text.startsWith('!')) { flags.hard = true; text = text.slice(1).trim(); } else if (text.startsWith('+')) { flags.pin = true; text = text.slice(1).trim(); } else break; }
  if (!text) return;
  if (!SC.ws || SC.ws.readyState !== 1) { status('Steer link down; reconnecting…', true); return; }
  SC.ws.send(JSON.stringify({ type: 'tip', target: SC.target, text, ...flags }));
  el.value = ''; SC.flags.hard = false; for (const b of document.querySelectorAll('#steer .flag.hard')) b.classList.remove('on');
}
function initSteer() {
  steerPlace(local.get('oai.steer.place', 'top')); steerFold(local.get('oai.steer.fold', false));
  $('#steerPlace').addEventListener('click', () => steerPlace(document.body.classList.contains('steer-bottom') ? 'top' : 'bottom'));
  $('#steerFold').addEventListener('click', () => steerFold(!$('#steer').classList.contains('collapsed')));
  for (const b of document.querySelectorAll('#steer .flag')) b.addEventListener('click', () => { const k = b.dataset.f; SC.flags[k] = !SC.flags[k]; b.classList.toggle('on', SC.flags[k]); b.setAttribute('aria-pressed', String(SC.flags[k])); });
  $('#steerIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); steerSend(); } });
  $('#steerSend').addEventListener('click', steerSend);
  document.addEventListener('keydown', e => { if (e.altKey && /^Digit[1-8]$/.test(e.code)) { e.preventDefault(); steerPaste(SC.macros[Number(e.code.slice(5)) - 1]?.text); } });
  steerRender(); steerConnect();
}
(async () => {
  initSteer();
  try { S = await api('/api/schema'); } catch (e) { status(`Cannot reach the config server: ${e.message}`, true); return; }
  window.PARAM = Object.fromEntries(S.params.map(p => [p.name, p]));
  STATE = await api('/api/state');
  build(); initColourway($("#leftCol")); renderLive(); renderValues();
  status(`READY · ${S.params.length} parameters · values are ${STATE.storage.kind === 'windows-user-env' ? 'Windows user environment variables' : STATE.storage.location}`);
  setInterval(() => api('/api/heartbeat', {}).catch(() => {}), 20000);
  setInterval(() => { if (!document.hidden) refresh(); }, 5000);
  setInterval(() => { $('#clock').textContent = new Date().toTimeString().slice(0, 5); }, 15000);
  $('#clock').textContent = new Date().toTimeString().slice(0, 5);
})();
</script>
