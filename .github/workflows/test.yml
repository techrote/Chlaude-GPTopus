name: Plugin unit tests

on:
  push:
  pull_request:

jobs:
  node-test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build desktop MCP extension
        run: node scripts/build-desktop.mjs
      - name: Run unit tests
        working-directory: plugins/openai-workers
        run: npm test

      - name: Validate desktop MCPB manifest (official toolchain)
        if: matrix.node == '22' && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p desktop-bundle
          unzip -q dist/Chlaude-GPTopus-Desktop.mcpb -d desktop-bundle
          npx --yes @anthropic-ai/mcpb validate desktop-bundle/manifest.json
