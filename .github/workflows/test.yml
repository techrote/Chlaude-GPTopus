name: ULTRA source qualification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify committed desktop MCP extension is reproducible
        run: node scripts/build-desktop.mjs --check
      - name: Run unit, integration and independent adversarial suites
        working-directory: plugins/openai-workers
        run: npm test

      - name: Run exact-source offline owner scenarios
        if: matrix.node == '22'
        run: node scripts/ultra-evaluate.mjs --output "${{ runner.temp }}/ultra-offline" --expect-sha ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exercise Windows owner entry point
        if: matrix.node == '22' && matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\Evaluate-ULTRA.ps1 -NonInteractive -OutputDirectory "$env:RUNNER_TEMP\ultra-windows-owner" -ExpectedSha ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload offline evidence
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: ultra-offline-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ultra-offline/
            ${{ runner.temp }}/ultra-windows-owner/
          if-no-files-found: warn

      - name: Validate desktop MCPB manifest (official toolchain)
        if: matrix.node == '22' && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p desktop-bundle
          unzip -q dist/Chlaude-GPTopus-Desktop.mcpb -d desktop-bundle
          npx --yes @anthropic-ai/mcpb validate desktop-bundle/manifest.json
